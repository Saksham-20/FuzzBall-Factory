# FuzzBall Factory: one origin, two upstreams. The storefront is served at /, the API at /api/ with the prefix
# stripped (same origin, so no CORS and no COOKIE_DOMAIN). Install with ops/install.sh: it replaces __DOMAIN__.
#
#   web  127.0.0.1:3100  (Next.js standalone, systemd fuzzball-web)
#   api  127.0.0.1:4100  (NestJS, systemd fuzzball-api)
#
# The API sets its refresh cookie on path /auth and the access cookie on /. Behind the /api prefix the browser must
# see /api/auth and /api/, hence the proxy_cookie_path lines: without them the cookies are never sent back.

server_tokens off;

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # certbot's HTTP-01 challenge; everything else goes to HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # `http2` on the listen line works on every nginx (Ubuntu 24.04 ships 1.24; the separate `http2 on;` needs 1.25.1+).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:fuzzball_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/snippets/fuzzball-headers.conf;

    # Staging only: uncomment to put the whole site behind basic auth (create the file with `htpasswd -c`), and keep
    # search engines out. Never on production: the Razorpay webhook could not reach the API through it.
    # auth_basic "FuzzBall staging";
    # auth_basic_user_file /etc/nginx/fuzzball.htpasswd;
    # add_header X-Robots-Tag "noindex, nofollow" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml application/rss+xml image/svg+xml;

    # Uploads are capped by the API at 5 MB; leave room for the multipart envelope.
    client_max_body_size 8m;
    client_body_timeout 30s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;   # overwrite, never append: the API trusts exactly one hop
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;

    # Razorpay webhook: signature-verified by the API, bursts on retries, so it gets no request limit.
    location = /api/payments/razorpay/webhook {
        limit_except POST { deny all; }
        proxy_pass http://fuzzball_api/payments/razorpay/webhook;
        proxy_cookie_path / /api/;
        proxy_cookie_path /auth /api/auth;
        include /etc/nginx/snippets/fuzzball-headers.conf;
    }

    # Sign-in, sign-up, reset: ten a minute per IP with a small burst.
    location /api/auth/ {
        limit_req zone=fuzzball_auth burst=10 nodelay;
        proxy_pass http://fuzzball_api/auth/;
        proxy_cookie_path / /api/;
        proxy_cookie_path /auth /api/auth;
        include /etc/nginx/snippets/fuzzball-headers.conf;
    }

    location = /api/contact {
        limit_req zone=fuzzball_contact burst=3 nodelay;
        proxy_pass http://fuzzball_api/contact;
        include /etc/nginx/snippets/fuzzball-headers.conf;
    }

    location /api/ {
        limit_req zone=fuzzball_api burst=40 nodelay;
        proxy_pass http://fuzzball_api/;
        proxy_cookie_path / /api/;
        proxy_cookie_path /auth /api/auth;
        include /etc/nginx/snippets/fuzzball-headers.conf;
    }

    # Hashed build assets never change under the same name.
    location /_next/static/ {
        proxy_pass http://fuzzball_web;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/fuzzball-headers.conf;
    }

    location / {
        limit_req zone=fuzzball_general burst=60 nodelay;
        proxy_pass http://fuzzball_web;
    }
}
