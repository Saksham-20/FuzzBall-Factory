# Goes in /etc/nginx/conf.d/ (http context). Per-IP request limits; the API also has its own in-process limits and
# persistent per-account lockouts, so these are the outer wall against floods, not the only defence.
limit_req_zone $binary_remote_addr zone=fuzzball_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=fuzzball_api:10m     rate=20r/s;
limit_req_zone $binary_remote_addr zone=fuzzball_auth:10m    rate=10r/m;
limit_req_zone $binary_remote_addr zone=fuzzball_contact:10m rate=5r/m;
limit_req_status 429;

# Keep the upstream pools small and reuse connections.
upstream fuzzball_web { server 127.0.0.1:3100; keepalive 8; }
upstream fuzzball_api { server 127.0.0.1:4100; keepalive 8; }
