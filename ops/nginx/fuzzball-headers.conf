# Included by every location that sets its own add_header (nginx drops inherited add_header lines the moment a
# location declares one). The page-level Content-Security-Policy comes from Next.js; the API sets its own via helmet.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
