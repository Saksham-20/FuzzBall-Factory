# Drop-in for Postgres (Ubuntu: /etc/postgresql/<version>/main/conf.d/fuzzball.conf), then `systemctl restart postgresql`.
# Sized for a single VPS that also runs nginx, the API (400M) and the storefront (450M): at least 2 GB RAM in total.
# Below that, resize the server before launch (docs/DEPLOY_PROD.md, capacity).

listen_addresses = 'localhost'        # never reachable from outside; migrations use an SSH tunnel
max_connections = 30                  # API pool 10 + migration + backup + psql sessions, with room to spare
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 4MB
maintenance_work_mem = 64MB
wal_compression = on
checkpoint_timeout = 10min

# Watch for slow queries without drowning the log.
log_min_duration_statement = 500ms
log_lock_waits = on
log_temp_files = 10MB
