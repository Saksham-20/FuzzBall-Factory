<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>FuzzBall Factory - Coming Soon</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/MotionPathPlugin.min.js"></script>
    <style>
      @font-face {
        font-family: "Modak";
        src: url("assets/fonts/modak.woff2") format("woff2");
        font-weight: 400;
      }
      @font-face {
        font-family: "Figtree";
        src: url("assets/fonts/figtree-700.woff2") format("woff2");
        font-weight: 300 900;
      }
      @font-face {
        font-family: "Big Shoulders Stencil";
        src: url("assets/fonts/stencil-800.woff2") format("woff2");
        font-weight: 800;
      }

      :root {
        --cocoa: #3f2619;
        --brown: #6b4228;
        --brown-soft: #8a6249;
        --cream: #f6eee3;
        --paper: #fcf8f2;
        --kraft: #d4ae80;
        --kraft-light: #e8d3b4;
        --butter: #f4cd52;
        --rose: #c98586;
        --rose-deep: #9c4f55;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--cream);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--cream);
        font-family: "Figtree", ui-sans-serif, system-ui, sans-serif;
        color: var(--cocoa);
      }
      #world {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 7000px;
      }
      #thread {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 7000px;
        overflow: visible;
      }
      .abs {
        position: absolute;
      }
      .stencil {
        font-family: "Big Shoulders Stencil", "Figtree", sans-serif;
        font-weight: 800;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        font-variant-numeric: tabular-nums;
        line-height: 1;
      }
      .display {
        font-family: "Modak", sans-serif;
        font-weight: 400;
        line-height: 0.92;
        letter-spacing: -0.005em;
        color: var(--cocoa);
        white-space: nowrap;
      }

      /* hero */
      #hero-h1 {
        left: 90px;
        top: 400px;
        font-size: 300px;
      }
      .line {
        display: block;
        width: fit-content;
        will-change: transform;
      }

      /* station nodes */
      .node {
        width: 96px;
        height: 96px;
        margin-left: -48px;
        margin-top: -48px;
        border-radius: 50%;
        background: var(--cocoa);
        color: var(--cream);
        display: grid;
        place-items: center;
        font-size: 46px;
        box-shadow: 0 1px 1px rgb(63 38 25 / 0.06), 0 6px 18px -6px rgb(63 38 25 / 0.22);
      }
      .st-label {
        font-size: 52px;
        color: var(--cocoa);
        white-space: nowrap;
      }
      .st-note {
        font-size: 36px;
        font-weight: 700;
        color: var(--brown);
        letter-spacing: -0.01em;
        white-space: nowrap;
      }

      /* kraft ticket */
      #ticket {
        left: 470px;
        top: 2240px;
        width: 540px;
        padding: 30px 32px 34px;
        border-radius: 42px;
        background:
          radial-gradient(120% 90% at 12% 0%, rgb(255 255 255 / 0.28), transparent 60%),
          radial-gradient(100% 80% at 100% 100%, rgb(168 128 79 / 0.22), transparent 60%), var(--kraft-light);
        box-shadow: 0 2px 2px rgb(63 38 25 / 0.06), 0 30px 54px -22px rgb(63 38 25 / 0.36);
        transform-origin: 50% 34px;
      }
      #ticket::before {
        content: "";
        position: absolute;
        top: 20px;
        left: 50%;
        width: 26px;
        height: 26px;
        margin-left: -13px;
        border-radius: 50%;
        background: var(--cream);
        box-shadow: inset 0 3px 3px rgb(63 38 25 / 0.32);
      }
      #ticket .head {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        padding: 26px 4px 0;
        font-size: 36px;
        color: var(--brown);
      }
      #ticket .body {
        margin-top: 26px;
        padding: 0 4px;
        font-size: 46px;
        font-weight: 700;
        text-wrap: balance;
        line-height: 1.16;
        letter-spacing: -0.01em;
      }

      /* ball */
      #ball {
        left: 360px;
        top: 3280px;
        width: 560px;
        height: 560px;
      }
      #ball-face {
        position: absolute;
        inset: 2.5%;
        border-radius: 50%;
        overflow: hidden;
        isolation: isolate;
        background: var(--rose);
      }
      #ball-rock {
        position: absolute;
        inset: 0;
      }
      #ball-wraps {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        transform-origin: 50% 50%;
      }
      #ball-rim {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      /* payoff line */
      #fuzz {
        left: 230px;
        top: 4010px;
        font-size: 140px;
      }
      #fuzz .hl {
        position: absolute;
        left: -2.5%;
        right: -2.5%;
        bottom: 4%;
        height: 42%;
        background: var(--butter);
        transform-origin: 0 50%;
        transform: rotate(-1deg);
      }
      #fuzz .word {
        position: relative;
        display: inline-block;
      }
      #dots {
        display: inline-flex;
        gap: 6px;
        margin-left: 10px;
      }
      #dots i {
        display: block;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: var(--cocoa);
        margin-top: 70px;
      }

      /* end card */
      #stamp {
        left: 250px;
        width: 780px;
        top: 4820px;
        display: flex;
        justify-content: center;
      }
      #stamp span {
        display: block;
        border: 9px dashed var(--cocoa);
        border-radius: 18px;
        padding: 26px 46px 22px;
        font-size: 104px;
        color: var(--cocoa);
        mix-blend-mode: multiply;
        transform: rotate(-4deg);
      }
      #logo {
        left: 250px;
        top: 5090px;
        width: 780px;
      }
      #tape {
        left: -80px;
        width: 1240px;
        top: 5760px;
        height: 132px;
        background: var(--butter);
        box-shadow: 0 2px 0 rgb(63 38 25 / 0.08);
        transform: rotate(-1.2deg);
        overflow: hidden;
      }
      #tape-track {
        position: absolute;
        left: 0;
        top: 0;
        height: 100%;
        display: flex;
        align-items: center;
        gap: 40px;
        white-space: nowrap;
        font-size: 54px;
        color: var(--cocoa);
        padding-left: 60px;
      }
      #tape-track svg {
        width: 50px;
        height: 50px;
        flex: none;
      }
      #handle {
        left: 250px;
        width: 780px;
        text-align: center;
        top: 5980px;
        font-size: 50px;
        font-weight: 700;
        letter-spacing: -0.01em;
        color: var(--brown);
      }
    </style>
  </head>

h d="M357.5 287A49.8 16.6 -45 1 0 287 357.5A49.8 16.6 -45 1 0 357.5 287Z" stroke="#e2acab" stroke-width="3.5" opacity="0.9"/><path d="M10.2 191.7A184.4 70.3 167.5 1 0 368.4 112A190 190 0 0 1 389.8 208.3A184.4 70.3 167.5 0 1 31.6 288A190 190 0 0 1 10.2 191.7Z" fill="#a95f62" opacity="0.3"/><path d="M10 200.1A186.2 70.9 167.5 1 0 372.2 119.6A190 190 0 0 1 390 199.9A186.2 70.9 167.5 0 1 27.8 280.4A190 190 0 0 1 10 200.1Z" fill="#c98586"/><path d="M24.1 271.7A187.7 71.5 167.5 0 0 389.8 190.5M14.5 241.2A190 72.4 167.5 0 0 385.5 158.8M10.2 209.5A187.7 71.5 167.5 1 0 375.9 128.3" stroke="#a95f62" stroke-width="7"/><path d="M21.4 264.9A188.6 71.9 167.5 0 0 389.3 183.2" stroke="#e2acab" stroke-width="3.5" opacity="0.9"/><path d="M13.1 234.2A189.9 72.4 167.5 1 0 383.8 151.8" stroke="#e2acab" stroke-width="3.5" opacity="0.9"/><path d="M10 202.2A186.5 71.1 167.5 1 0 373 121.5" stroke="#e2acab" stroke-width="3.5" opacity="0.9"/><path d="M138.6 20.2A172.4 52.3 -135 1 0 379.8 261.4A190 190 0 0 1 261.4 379.8A172.4 52.3 -135 0 1 20.2 138.6A190 190 0 0 1 138.6 20.2Z" fill="#a95f62" opacity="0.3"/><path d="M130.4 23.2A175.7 53.3 -135 1 0 376.8 269.6A190 190 0 0 1 269.6 376.8A175.7 53.3 -135 0 1 23.2 130.4A190 190 0 0 1 130.4 23.2Z" fill="#c98586"/><path d="M27 121.5A179 54.3 -135 0 0 278.5 373M40.3 97A186.1 56.4 -135 0 0 303 359.7M56.5 75.4A189.6 57.5 -135 0 0 324.6 343.5M75.4 56.5A189.6 57.5 -135 1 0 343.5 324.6M97 40.3A186.1 56.4 -135 1 0 359.7 303M121.5 27A179 54.3 -135 1 0 373 278.5" stroke="#a95f62" stroke-width="7"/><path d="M30.2 114.8A181.2 55 -135 0 0 285.2 369.8" stroke="#e2acab" stroke-width="3.5" opacity="0.9"/><path d="M44.3 91.1A187.4 56.8 -135 0 0 308.9 355.7" stroke="#e2acab" stroke-width="3.5" opacity="0.9"/><path d="M61.2 70.2A189.9 57.6 -135 0 0 329.8 338.8" stroke="#e2acab" stroke-width="3.5" opacity="0.9"/><path d="M80.8 52A189 57.3 -135 1 0 348 319.2" stroke="#e2acab" stroke-width="3.5" opacity="0.9"/><path d="M103.1 36.6A184.6 56 -135 1 0 363.4 296.9" stroke="#e2acab" stroke-width="3.5" opacity="0.9"/><path d="M128.4 24A176.5 53.5 -135 1 0 376 271.6" stroke="#e2acab" stroke-width="3.5" opacity="0.9"/></svg></div></div>
<svg id="ball-rim" viewBox="0 0 400 400"><path d="M309.7 44.9A190 190 0 0 1 160.6 385.9A200 200 0 0 0 309.7 44.9Z" fill="#a95f62" opacity="0.2"/><circle cx="200" cy="200" r="190" fill="none" stroke="#a95f62" stroke-width="5"/></svg></div>

        <!-- the hook rides above the ball -->
        <svg id="hook-layer" class="abs" style="left: 0; top: 0; width: 1080px; height: 7000px; overflow: visible; pointer-events: none" viewBox="0 0 1080 7000">
          <g id="hook">
            <g transform="rotate(-152) scale(1.5) translate(-27 -22)">

              <rect x="13" y="60" width="14" height="250" rx="7" fill="#6b4228" />
              <rect x="8" y="150" width="24" height="52" rx="11" fill="#8a6249" />
              <rect x="16.5" y="72" width="2.4" height="228" rx="1.2" fill="#a8804f" opacity="0.7" />
              <g fill="none" stroke="#c98586" stroke-width="3" stroke-linecap="round">
                <ellipse cx="20" cy="86" rx="9.5" ry="3" />
                <ellipse cx="20" cy="94" rx="9.5" ry="3" />
                <ellipse cx="20" cy="102" rx="9.5" ry="3" />

        <!-- payoff -->

          <span class="word"><span class="hl"></span><span id="fuzz-word" style="position: relative; display: inline-block">Fuzzballs</span></span><span id="dots"><i></i><i></i><i></i></span>

        <!-- end card -->

            <svg viewBox="0 0 50 50" fill="none" stroke-linecap="round"><circle cx="25" cy="25" r="21" fill="#c98586" stroke="#a95f62" stroke-width="3"/><path d="M8 20C18 26 32 26 43 18M6 30C18 37 34 36 45 28M17 7C24 16 25 34 20 44" stroke="#a95f62" stroke-width="2.5"/></svg><span>Opening soon</span>

    <script>
      gsap.registerPlugin(MotionPathPlugin);

      /* ── thread geometry (world px, 1080 wide) ── */
      const START = "M950,-60";
      const SEGS = [
        "C950,240 985,420 940,640", // 0 drop on the right
        "C890,880 700,1010 520,1090", // 1 sweep under the headline
        "C340,1170 150,1150 140,1340", // 2 into the conveyor lane (end of hero)
        "C140,1600 140,1800 140,2050", // 3 station 01
        "C190,2200 190,2300 140,2450", // 4 station 02
        "C90,2600 90,2700 140,2850", // 5 station 03
        "C140,3050 200,3400 380,3540", // 6 into the ball
        "C470,3610 430,3720 487,3781", // 7 inside the ball to its tail
        "C480,3860 140,3780 140,4020", // 8 tail swings to the lane
        "C140,5000 140,5800 140,6500", // 9 tail runs off the bottom
      ];
      const D = START + " " + SEGS.join(" ");
      ["thread-shadow", "thread-path", "thread-sheen"].forEach((id) => document.getElementById(id).setAttribute("d", D));

      const probe = document.createElementNS("http://www.w3.org/2000/svg", "path");
      const total = (probe.setAttribute("d", D), probe.getTotalLength());
      const F = SEGS.map((_, i) => {
        probe.setAttribute("d", START + " " + SEGS.slice(0, i + 1).join(" "));
        return probe.getTotalLength() / total;
      });
      F.unshift(0);

      const tl = gsap.timeline({ paused: true });
      const EASE_OUT = "expo.out";
      const INOUT = "power3.inOut";

      /* thread + hook run: [fromSeg, toSeg, start, dur, ease] */
      const DRAW = ["#thread-shadow", "#thread-path", "#thread-sheen"];
      DRAW.forEach((sel) => { const el = document.querySelector(sel); el.style.strokeDasharray = total + " " + total * 2; });
      gsap.set(DRAW, { strokeDashoffset: total });
      gsap.set("#hook", { x: 950, y: -60 });
      const run = (a, b, t, dur, ease) => {
        tl.to(DRAW, { strokeDashoffset: total * (1 - F[b]), duration: dur, ease }, t);
        tl.to("#hook", { motionPath: { path: "#thread-path", start: F[a], end: F[b] }, duration: dur, ease }, t);
      };
      run(0, 3, 0.15, 2.45, "power2.inOut"); // hero: drop, sweep, into lane
      run(3, 4, 2.75, 0.62, "power2.inOut"); // to station 01
      run(4, 5, 3.5, 0.55, "power2.inOut"); // to station 02
      run(5, 6, 4.2, 0.55, "power2.inOut"); // to station 03
      run(6, 7, 4.95, 1.3, "power2.inOut"); // to the ball
      run(7, 9, 6.55, 0.6, "power2.in");
      run(9, 10, 7.15, 1.45, "none");
      tl.set("#hook-layer", { opacity: 0 }, 8.7);

      /* camera */
      gsap.set("#world", { y: 0 });
      tl.to("#world", { y: -1500, duration: 1.0, ease: INOUT }, 2.6);
      tl.to("#world", { y: -2900, duration: 1.05, ease: INOUT }, 4.95);
      tl.to("#world", { y: -4300, duration: 0.95, ease: INOUT }, 8.55);

      /* hero lines rise 70ms apart */
      gsap.set(["#l1", "#l2"], { opacity: 0, y: 46 });
      tl.to("#l1", { opacity: 1, y: 0, duration: 0.8, ease: EASE_OUT }, 0.5);
      tl.to("#l2", { opacity: 1, y: 0, duration: 0.8, ease: EASE_OUT }, 0.57);

      /* stations: node pops and turns live-rose when the thread arrives */
      const nodes = [
        { n: "#n1", text: "#s1-text", t: 3.26 },
        { n: "#n2", text: "#s2-text", t: 3.98 },
        { n: "#n3", text: "#s3-text", t: 4.7 },
      ];
      gsap.set(nodes.flatMap((x) => [x.n, x.text]), { opacity: 0 });
      nodes.forEach((s, i) => {
        tl.set(s.n, { opacity: 1 }, s.t);
        tl.fromTo(s.n, { scale: 0.4 }, { scale: 1, duration: 0.34, ease: "back.out(2.2)" }, s.t);
        tl.to(s.n, { backgroundColor: "#9c4f55", duration: 0.12, ease: "none" }, s.t);
        tl.fromTo(s.text, { x: -24, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: EASE_OUT }, s.t + 0.06);
        if (nodes[i + 1]) tl.to(s.n, { backgroundColor: "#3f2619", duration: 0.2, ease: "none" }, nodes[i + 1].t);
      });

      /* ticket swings from its punched hole, then settles */
      gsap.set("#ticket", { opacity: 0, rotation: -16 });
      tl.to("#ticket", { opacity: 1, duration: 0.18, ease: "none" }, 3.98);
      tl.to("#ticket", { keyframes: [{ rotation: 8, duration: 0.42 }, { rotation: -4, duration: 0.34 }, { rotation: 2, duration: 0.3 }, { rotation: -0.6, duration: 0.26 }, { rotation: 0, duration: 0.24 }], ease: "sine.inOut" }, 3.98);

      /* the ball: pops when the tip arrives, wraps rock once */
      gsap.set("#ball", { scale: 0.4, opacity: 0, rotation: -14, transformOrigin: "50% 50%" });
      tl.to("#ball", { scale: 1, opacity: 1, rotation: 0, duration: 0.6, ease: "back.out(1.7)" }, 5.7);
      tl.fromTo("#ball-rock", { rotation: -16, transformOrigin: "50% 50%" }, { rotation: 10, duration: 2.6, ease: "sine.inOut" }, 5.8);

      
      /* payoff: Fuzzballs + butter swipe, then three dots */
      gsap.set("#fuzz-word", { opacity: 0, y: 40 });
      gsap.set("#fuzz .hl", { scaleX: 0 });
      gsap.set("#dots i", { scale: 0, opacity: 0 });
      tl.to("#fuzz-word", { opacity: 1, y: 0, duration: 0.8, ease: EASE_OUT }, 6.5);
      tl.to("#fuzz .hl", { scaleX: 1, duration: 0.55, ease: "power4.out" }, 6.75);
      tl.to("#dots i", { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(3)", stagger: 0.16 }, 7.55);

      /* end card */
      gsap.set("#stamp-inner", { opacity: 0, scale: 1.7 });
      gsap.set("#logo", { opacity: 0, clipPath: "inset(0 100% 0 0)" });
      gsap.set("#tape", { x: 1300 });
      gsap.set("#handle", { opacity: 0, y: 18 });
      tl.to("#stamp-inner", { opacity: 1, scale: 1, duration: 0.24, ease: "power4.in" }, 9.55);
      tl.to("#stamp-inner", { keyframes: [{ y: 7, duration: 0.06 }, { y: 0, duration: 0.2 }], ease: "power2.out" }, 9.79);
      tl.to("#logo", { opacity: 1, duration: 0.2, ease: "none" }, 9.9);
      tl.to("#logo", { clipPath: "inset(0 0% 0 0)", duration: 0.9, ease: "power3.out" }, 9.9);
      tl.to("#tape", { x: 0, duration: 0.7, ease: "power4.out" }, 10.4);
      tl.to("#tape-track", { x: -420, duration: 2.0, ease: "none" }, 10.4);
      tl.to("#handle", { opacity: 1, y: 0, duration: 0.6, ease: EASE_OUT }, 10.9);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
